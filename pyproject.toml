[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarapp"
version = "0.4.0"
description = "Quicklook webapp for solar & ionospheric physics data (Solar Flare Finder successor)"
requires-python = ">=3.10"
dependencies = [
    "sunpy[net,timeseries]>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "numpy>=1.24",
    "cdflib>=1.0",      # Wind/WAVES L2 CDFs
    "h5netcdf>=1.0",    # GOES EUVS netCDF
    "matplotlib>=3.7",  # Hinode SOT FITS rendering
    "astroquery>=0.4.7", # JPL Horizons spacecraft ephemerides (positions)
]

[project.optional-dependencies]
dev = ["pytest"]
# free-form query understanding; dormant unless ANTHROPIC_API_KEY is set
llm = ["anthropic>=0.60"]

[project.scripts]
solarapp = "solarapp.__main__:main"

[tool.setuptools.packages.find]
include = ["solarapp*"]

[tool.setuptools.package-data]
"solarapp.server" = ["static/*"]
