<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolarQuick</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0d1117; color:#e6edf3;
         margin: 0; padding: 0; }
  h1 { font-weight: 600; font-size: 1.4rem; } h1 span { color:#f0a832; }
  form { display:flex; gap:.5rem; margin:1rem 0; }
  input { flex:1; padding:.7rem 1rem; font-size:1rem; border-radius:8px;
          border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button { padding:.7rem 1.2rem; font-size:1rem; border-radius:8px; border:none;
           background:#f0a832; color:#0d1117; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #msg { color:#ff7b72; margin:.5rem 0; white-space:pre-wrap; }
  #meta { color:#8b949e; font-size:.85rem; margin-top:.5rem; }
  #plot { width:100%; height:520px; }
  .hint { color:#8b949e; font-size:.85rem; }
  .imgview h2 { font-size:1rem; font-weight:600; text-align:center; margin:.5rem 0; }
  .imgview .mainimg { display:block; max-width:640px; width:100%; margin:0 auto;
                      border-radius:8px; background:#161b22; cursor:zoom-in; }
  .imgview .imgcap { text-align:center; color:#8b949e; font-size:.85rem; margin:.5rem 0; }
  .imgview .thumbs { display:flex; gap:.4rem; justify-content:center; flex-wrap:wrap; margin:.5rem 0; }
  .imgview .thumbs img { width:72px; height:72px; border-radius:6px; cursor:pointer;
                         border:2px solid transparent; background:#161b22; }
  .imgview .thumbs img.sel { border-color:#f0a832; }
  .imgview .note { color:#d29922; font-size:.85rem; text-align:center; margin:.5rem 0; }
  .regions .rsum { color:#8b949e; font-size:.82rem; margin:.5rem 0; }
  .regions .rsum b { color:#e6edf3; font-weight:600; }
  .events h2 { font-size:1rem; font-weight:600; text-align:center; margin:.8rem 0 .4rem; }
  .events table { width:100%; border-collapse:collapse; font-size:.9rem; }
  .events th, .events td { padding:.35rem .6rem; text-align:left;
                           border-bottom:1px solid #21262d; }
  .events th { color:#8b949e; font-weight:600; }
  .events tbody tr { cursor:pointer; }
  .events tbody tr:hover { background:#161b22; }
  .events tr.sel { background:#1c2128; outline:1px solid #f0a832; }
  .events td:first-child { color:#f0a832; font-weight:600; }
  .evhint { color:#8b949e; font-size:.8rem; text-align:center; margin:.4rem 0 1rem; }
  .movie .mspec { width:100%; height:440px; }
  .movie .mlc { width:100%; height:220px; }
  .movie .mctl { display:flex; gap:.6rem; align-items:center; margin:.2rem 0 .3rem; }
  .movie .mctl button { padding:.3rem .8rem; font-size:.9rem; min-width:2.8rem; }
  .movie .mslider { flex:1; padding:0; border:none; background:none; accent-color:#f0a832; }
  .movie .mtime { color:#8b949e; font-size:.85rem; font-variant-numeric:tabular-nums; }
  .movie select { background:#161b22; color:#e6edf3; border:1px solid #30363d;
                  border-radius:6px; padding:.25rem; font-size:.8rem; }
  .dl { display:flex; gap:.4rem; justify-content:flex-end; align-items:center;
        margin:.1rem 0 1.2rem; }
  .dl button { padding:.3rem .7rem; font-size:.78rem; font-weight:500;
               border-radius:6px; border:1px solid #30363d; background:#161b22;
               color:#8b949e; cursor:pointer; }
  .dl button:hover:not(:disabled) { color:#e6edf3; border-color:#8b949e; }
  .dl button:disabled { opacity:.45; cursor:default; }
  .dl .dlerr { color:#d29922; font-size:.78rem; margin-right:auto; }

  /* progress: what is being fetched, how long it usually takes, how long so far */
  #prog { margin:.8rem 0; display:none; }
  #prog.on { display:block; }
  .prog-head { color:#e6edf3; font-size:.9rem; margin-bottom:.15rem; }
  .prog-when { color:#8b949e; font-size:.82rem; margin-bottom:.6rem; }
  .prog-row { display:grid; grid-template-columns:1.1rem 1fr auto; gap:.5rem;
              align-items:baseline; padding:.3rem 0; font-size:.87rem; }
  .prog-row .mark { color:#8b949e; }
  .prog-row.done .mark { color:#58d6a3; }
  .prog-row.failed .mark { color:#ff7b72; }
  .prog-row.queued { opacity:.55; }
  .prog-row .what { color:#e6edf3; }
  .prog-row .opts { color:#8b949e; }
  .prog-row .t { color:#8b949e; font-variant-numeric:tabular-nums; font-size:.8rem; }
  .prog-row .err { grid-column:2 / -1; color:#d29922; font-size:.8rem; }
  .prog-bar { grid-column:2 / -1; height:3px; border-radius:2px; background:#21262d;
              overflow:hidden; }
  .prog-bar i { display:block; height:100%; background:#f0a832; width:0;
                transition:width .12s linear; }
  .prog-row.done .prog-bar i { background:#58d6a3; }
  .prog-row.failed .prog-bar i { background:#ff7b72; }
  /* no estimate yet: a sweep, so it reads as "working", not as "60% done" */
  .prog-bar.unknown i { width:35% !important; animation:sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% {margin-left:-35%;} 100% {margin-left:100%;} }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* two panes: the form on the left, results on the right */
  .app { display:grid; grid-template-columns: 330px minmax(0, 1fr); min-height:100vh; }
  aside { background:#0b0f14; border-right:1px solid #21262d; padding:1rem 1rem 2rem;
          position:sticky; top:0; height:100vh; overflow-y:auto; box-sizing:border-box; }
  main { padding:1rem 1.5rem 2rem; min-width:0; }
  aside h1 { margin:.2rem 0 .8rem; }
  aside form { margin:.4rem 0 .3rem; }
  aside form input { padding:.55rem .7rem; font-size:.92rem; }
  aside form button { padding:.55rem .8rem; font-size:.92rem; }
  aside details { border:1px solid #21262d; border-radius:8px; margin:.6rem 0; background:#0d1117; }
  aside summary { cursor:pointer; padding:.5rem .7rem; font-size:.88rem; font-weight:600;
                  color:#e6edf3; list-style:none; }
  aside summary::before { content:"▸ "; color:#8b949e; }
  aside details[open] summary::before { content:"▾ "; }
  aside summary .cnt { color:#f0a832; font-weight:500; margin-left:.3rem; }
  .pane { padding:.2rem .7rem .7rem; display:flex; flex-direction:column; gap:.45rem; }
  .pane label.fld { display:grid; grid-template-columns:3.2rem 1fr; align-items:center;
                    font-size:.82rem; color:#8b949e; gap:.4rem; }
  .pane input[type=datetime-local], .pane select {
    padding:.35rem .45rem; font-size:.85rem; border-radius:6px; border:1px solid #30363d;
    background:#161b22; color:#e6edf3; color-scheme:dark; flex:none; }
  .pane select:disabled { opacity:.45; }
  .row { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  .sbtn { padding:.3rem .6rem; font-size:.78rem; font-weight:500; border-radius:6px;
          border:1px solid #30363d; background:#161b22; color:#c9d1d9; cursor:pointer; }
  .sbtn:hover { border-color:#8b949e; color:#e6edf3; }
  .chk { font-size:.84rem; color:#c9d1d9; display:flex; align-items:center; gap:.35rem; }
  .chk input, .src input { flex:none; padding:0; accent-color:#f0a832; }
  .tgroup { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:#8b949e;
            margin:.5rem 0 .1rem; }
  .src { position:relative; }
  .src .sline { display:flex; gap:.4rem; align-items:center; font-size:.84rem; padding:.12rem 0;
                padding-right:1.4rem; cursor:pointer; }
  .src.off { opacity:.4; }
  .src .exp { position:absolute; right:0; top:0; background:none; border:none; color:#8b949e;
              padding:.1rem .3rem; font-size:.8rem; cursor:pointer; }
  .src.open .exp { transform:rotate(90deg); }
  .src .opts { display:none; flex-wrap:wrap; gap:.15rem .7rem; padding:.15rem 0 .35rem 1.4rem; }
  .src.open .opts { display:flex; }
  .src .opts label { font-size:.78rem; color:#c9d1d9; display:flex; gap:.3rem; align-items:center;
                     cursor:pointer; }
  .side-hint { color:#8b949e; font-size:.75rem; line-height:1.35; }
  #loadrow { margin:.7rem 0; }
  #loadrow #load { flex:1; padding:.6rem; }
  .presets { margin-top:1rem; display:flex; flex-direction:column; gap:.35rem; }
  .presets .lbl { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:#8b949e; }
  .presets button { text-align:left; padding:.5rem .7rem; font-size:.84rem; font-weight:500;
                    background:#161b22; color:#e6edf3; border:1px solid #30363d; }
  .presets button:hover { border-color:#f0a832; }
  .presets button small { display:block; color:#8b949e; font-weight:400; font-size:.74rem; }

  /* image grid: 1, 2, 3 in a row; 4 as 2×2; 5 as 3+2; 6 as 3+3; more in rows of 3 */
  .imgwrap { margin-bottom:1rem; }
  .imggrid { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; }
  .cell { background:#161b22; border:1px solid #21262d; border-radius:8px; overflow:hidden;
          box-sizing:border-box; }
  .cell .ctitle { font-size:.8rem; font-weight:600; padding:.35rem .6rem; color:#e6edf3; }
  .cell .cimg { aspect-ratio:1; background:#0d1117; }
  .cell img { width:100%; height:100%; display:block; object-fit:contain; cursor:zoom-in; }
  .cell .ccap { font-size:.74rem; color:#8b949e; padding:.3rem .6rem;
                font-variant-numeric:tabular-nums; }
  .transport { display:flex; gap:.5rem; align-items:center; margin:.6rem 0 .2rem; flex-wrap:wrap; }
  .transport button { padding:.3rem .75rem; font-size:.9rem; min-width:2.4rem; }
  .transport .tslider { flex:1; min-width:8rem; padding:0; border:none; background:none;
                        accent-color:#f0a832; }
  .transport .ttime { color:#8b949e; font-size:.82rem; font-variant-numeric:tabular-nums; }
  .transport select { background:#161b22; color:#e6edf3; border:1px solid #30363d;
                      border-radius:6px; padding:.25rem; font-size:.8rem; }
  .events .evbody { display:flex; gap:1rem; align-items:flex-start; }
  .events .flaredisk { width:300px; height:300px; flex:none; }
  .events .evtable { flex:1; max-height:320px; overflow-y:auto; }
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Solar<span>Quick</span></h1>
  <form id="f">
    <input id="q" placeholder="e.g. biggest flare since 2014" autocomplete="off">
    <button id="go">Go</button>
  </form>
  <div class="side-hint">Typing fills the form below; adjust it and press Load.</div>

  <details id="when" open>
    <summary>Date &amp; time (UT)</summary>
    <div class="pane">
      <label class="fld">Start <input type="datetime-local" id="t0" step="60"></label>
      <label class="fld">End <input type="datetime-local" id="t1" step="60"></label>
      <div class="row">
        <button type="button" class="sbtn" data-shift="-1">◀ day</button>
        <button type="button" class="sbtn" data-shift="1">day ▶</button>
        <button type="button" class="sbtn" id="today">Today</button>
        <button type="button" class="sbtn" id="yday">Yesterday</button>
      </div>
    </div>
  </details>

  <details id="imgopts" open>
    <summary>Images</summary>
    <div class="pane">
      <label class="fld">Crop <select id="crop">
        <option value="0">Full disk</option><option value="1000">1000″ at flare</option>
        <option value="500">500″ at flare</option><option value="250">250″ at flare</option>
      </select></label>
      <label class="fld">Frames <select id="frames">
        <option>12</option><option selected>24</option><option>48</option>
      </select></label>
      <label class="chk"><input type="checkbox" id="movie"> Play as movie (otherwise stills)</label>
    </div>
  </details>

  <details id="instr" open>
    <summary>Instruments <span class="cnt" id="nsel"></span></summary>
    <div class="pane">
      <div id="tree"></div>
      <div class="side-hint">Nothing ticked: GOES X-rays, flare list and sites,
        spacecraft positions, AIA 171 + 304 (EIT before 2010).</div>
    </div>
  </details>

  <div class="row" id="loadrow">
    <button type="button" id="load">Load</button>
    <button type="button" class="sbtn" id="clear">Clear ticks</button>
  </div>

  <div class="presets" id="presets"><div class="lbl">Quick select</div></div>
</aside>
<main>
  <div id="msg"></div>
  <div id="prog"></div>
  <div id="plot"></div>
  <div id="meta"></div>
</main>
</div>
<script>
// -- the left panel ------------------------------------------------------
// One form, two ways in: typing a request fills it (/api/parse — nothing is
// fetched), ticking edits it, and Load runs exactly what it shows
// (/api/run/stream). Nothing ticked is a request too: the default view.

const $ = id => document.getElementById(id);
const f = $("f"), q = $("q"), go = $("go"), msg = $("msg"), meta = $("meta"),
      prog = $("prog"), t0 = $("t0"), t1 = $("t1"), cropSel = $("crop"),
      framesSel = $("frames"), movieBox = $("movie"), tree = $("tree"),
      loadBtn = $("load");

let currentQuery = "";  // recorded in export headers so a file says what made it
let catalog = {};       // source name → its /api/sources row
let sel = new Map();    // "source" or "source|option" → {source, extras}
let lastRun = null;     // body of the last Load (the grid's flare-peak tick reads it)
const CONTEXT = ["flares", "solar_regions", "positions", "earth_illumination"];

const pad = n => String(n).padStart(2, "0");
const isoMin = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}` +
                    `T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
const fromField = v => new Date(v + ":00Z");
const dayStart = d => { const x = new Date(d); x.setUTCHours(0, 0, 0, 0); return x; };

function setWindow(a, b) { t0.value = isoMin(a); t1.value = isoMin(b); refreshCoverage(); }
function yesterday() { const d = dayStart(new Date()); return [new Date(d - 864e5), d]; }

document.querySelectorAll("[data-shift]").forEach(b => b.addEventListener("click", () => {
  const s = +b.dataset.shift * 864e5;
  setWindow(new Date(fromField(t0.value).getTime() + s), new Date(fromField(t1.value).getTime() + s));
}));
$("today").addEventListener("click", () => setWindow(dayStart(new Date()), new Date()));
$("yday").addEventListener("click", () => setWindow(...yesterday()));
[t0, t1].forEach(el => el.addEventListener("change", refreshCoverage));
$("clear").addEventListener("click", () => { sel.clear(); syncTree(); });
loadBtn.addEventListener("click", () => load());

// -- the instrument tree, built from what the plugins declare -------------

const primaryOptions = r => r.options.filter(o => o.group === r.variable_key);

async function loadCatalog() {
  const rows = await (await fetch("/api/sources")).json();
  catalog = Object.fromEntries(rows.map(r => [r.name, r]));
  const groups = [
    ["Images", r => r.display === "images"],
    ["Light curves & spectra", r => r.display !== "images" && !CONTEXT.includes(r.name)],
    ["Events & context", r => CONTEXT.includes(r.name)],
  ];
  tree.innerHTML = "";
  for (const [title, pick] of groups) {
    const h = document.createElement("div");
    h.className = "tgroup"; h.textContent = title;
    tree.appendChild(h);
    rows.filter(pick).forEach(r => tree.appendChild(sourceRow(r)));
  }
  refreshCoverage(); syncTree();
}

function sourceRow(r) {
  const opts = primaryOptions(r);
  const row = document.createElement("div");
  row.className = "src"; row.dataset.src = r.name;
  row.innerHTML = `<label class="sline"><input type="checkbox" data-key="${r.name}">
      <span>${escapeHtml(r.display_name)}</span></label>` +
    (opts.length ? `<button type="button" class="exp" title="Options">▸</button>
      <div class="opts">${opts.map(o => `<label><input type="checkbox"
        data-key="${r.name}|${escapeHtml(o.key)}">${escapeHtml(o.label)}</label>`).join("")}</div>` : "");
  row.querySelector(".exp")?.addEventListener("click", () => row.classList.toggle("open"));
  row.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => toggle(cb)));
  return row;
}

function toggle(cb) {
  const key = cb.dataset.key, [src, opt] = key.split("|");
  const family = k => k === src || k.startsWith(src + "|");
  if (!opt) {
    if (!cb.checked) [...sel.keys()].filter(family).forEach(k => sel.delete(k));
    else if (![...sel.keys()].some(family)) sel.set(src, {source: src, extras: {}});
  } else if (cb.checked) {
    const o = catalog[src].options.find(o => o.key === opt);
    sel.delete(src);  // a named option replaces the instrument's default
    sel.set(key, {source: src, extras: {...o.extras}});
  } else sel.delete(key);
  syncTree();
}

function syncTree() {
  const keys = [...sel.keys()];
  tree.querySelectorAll("input[data-key]").forEach(cb => {
    const key = cb.dataset.key;
    cb.checked = key.includes("|") ? sel.has(key)
                                   : keys.some(k => k === key || k.startsWith(key + "|"));
  });
  tree.querySelectorAll(".src").forEach(row => {
    if (keys.some(k => k.startsWith(row.dataset.src + "|"))) row.classList.add("open");
  });
  $("nsel").textContent = sel.size ? `${sel.size} selected` : "default view";
  // crop/frames/movie only mean something when images will be shown
  const images = !sel.size || [...sel.values()].some(r => catalog[r.source]?.display === "images");
  [cropSel, framesSel, movieBox].forEach(el => el.disabled = !images);
}

function refreshCoverage() {
  if (!t0.value || !t1.value) return;
  const a = fromField(t0.value), b = fromField(t1.value);
  tree.querySelectorAll(".src").forEach(row => {
    const [c0, c1] = catalog[row.dataset.src]?.coverage || [];
    const off = (c0 && b < new Date(c0 + "T00:00:00Z")) || (c1 && a > new Date(c1 + "T23:59:59Z"));
    row.classList.toggle("off", !!off);
    row.title = off ? `Not observing in this window (covers ${c0 || "…"} – ${c1 || "now"})` : "";
  });
}

// a parsed sentence → the form: window, ticks (keeping any extras the tree
// cannot show, such as an event view's crop centre), and the crop it chose
function fillFromParse(p) {
  setWindow(new Date(p.start), new Date(p.end));
  sel.clear();
  for (const r of p.requests) {
    const src = catalog[r.source];
    const opt = src && primaryOptions(src).find(o =>
      Object.entries(o.extras).every(([k, v]) => r.extras[k] === v));
    let key = opt ? `${r.source}|${opt.key}` : r.source;
    while (sel.has(key)) key += "+";
    sel.set(key, {source: r.source, extras: r.extras});
  }
  const crop = p.crop_fov ? String(p.crop_fov) : "0";
  if (![...cropSel.options].some(o => o.value === crop)) cropSel.add(new Option(`${crop}″ at flare`, crop));
  cropSel.value = crop;
  syncTree();
}

function busy(on) {
  go.disabled = loadBtn.disabled = on;
  loadBtn.textContent = on ? "Fetching…" : "Load";
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!q.value.trim()) return load();
  msg.textContent = ""; msg.style.color = ""; busy(true);
  try {
    const r = await fetch("/api/parse", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({q: q.value}),
    });
    const p = await r.json();
    if (!r.ok) { msg.textContent = (p.errors || ["Could not read that request."]).join("\n"); return; }
    fillFromParse(p);
    busy(false);
    await load(q.value, p.note);
  } catch (err) { msg.textContent = "Error: " + err; }
  finally { busy(false); }
});

async function load(label, note) {
  if (!t0.value || !t1.value) { msg.textContent = "Set a start and end time."; return; }
  const requests = [...sel.values()];
  const images = !requests.length || requests.some(r => catalog[r.source]?.display === "images");
  lastRun = {
    start: t0.value + ":00Z", end: t1.value + ":00Z", requests,
    frames: images ? +framesSel.value : null,
    crop_fov: images ? +cropSel.value : null,
    movie: images && movieBox.checked,
    label: label || (requests.length ? "your selection" : "the default view"),
  };
  currentQuery = label || "";
  msg.textContent = note || ""; msg.style.color = note ? "#d29922" : "";
  meta.textContent = "";
  stopMovies();
  plotDiv.innerHTML = "";
  progress.begin(lastRun.label);
  busy(true);
  try { await streamRun("/api/run/stream", lastRun); }
  catch (err) { msg.textContent = "Error: " + err; progress.stop(); }
  finally { busy(false); }
}

async function streamRun(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!r.body || !r.body.getReader) {  // no readable stream: take it all at once
    (await r.text()).split("\n").filter(l => l.trim()).forEach(l => handleEvent(JSON.parse(l)));
    return;
  }
  const reader = r.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split("\n");
    buffer = lines.pop();                      // keep the partial line
    for (const line of lines) if (line.trim()) handleEvent(JSON.parse(line));
  }
  if (buffer.trim()) handleEvent(JSON.parse(buffer));
}

// -- quick select ----------------------------------------------------------

const PRESETS = [
  {label: "Biggest flare this year", hint: "Event view of the year's largest flare",
   go: () => typed(`biggest flare since ${new Date().getUTCFullYear()}`)},
  {label: "Yesterday overview", hint: "Default view for yesterday",
   go: () => { setWindow(...yesterday()); sel.clear(); cropSel.value = "0";
               movieBox.checked = false; syncTree(); load("yesterday overview"); }},
  {label: "X9.3 · 2017-09-06 · AIA quad movie", hint: "94/131/171/304 movie + GOES + FISM",
   go: () => {
     setWindow(new Date("2017-09-06T11:40:00Z"), new Date("2017-09-06T12:30:00Z"));
     sel.clear();
     ["aia_94", "aia_131", "aia_171", "aia_304"].forEach(c =>
       sel.set(`sdo_images|${c}`, {source: "sdo_images", extras: {channel: c}}));
     ["goes_xrs", "flares", "fism"].forEach(s => sel.set(s, {source: s, extras: {}}));
     cropSel.value = "500"; framesSel.value = "24"; movieBox.checked = true;
     syncTree(); load("X9.3 2017-09-06 AIA quad movie");
   }},
  {label: "Halloween 2003 · X17", hint: "Pre-SDO event view: EIT + GOES + FISM",
   go: () => typed("flare at 2003-10-28 11:10")},
];

function typed(text) { q.value = text; movieBox.checked = false; f.requestSubmit(); }

function init() {
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `${escapeHtml(p.label)}<small>${escapeHtml(p.hint)}</small>`;
    b.addEventListener("click", p.go);
    $("presets").appendChild(b);
  });
  setWindow(...yesterday());
  loadCatalog().catch(e => { msg.textContent = "Could not load the instrument list: " + e; });
}

function handleEvent(ev) {
  if (ev.event === "parsed") progress.plan(ev);
  else if (ev.event === "source_done") progress.finish(ev);
  else if (ev.event === "result") { progress.stop(); render(ev.spec); }
  else if (ev.event === "error") {
    progress.stop();
    msg.textContent = (ev.errors || ["Request failed"]).join("\n");
  }
}

// -- the loading display -----------------------------------------------
// Three things a spinner cannot say: what was understood, what is being
// fetched, and whether this is taking longer than it usually does.

const progress = (() => {
  let rows = [], timer = null, parallel = 4;

  const secs = ms => (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + " s";

  function begin(query) {
    rows = [];
    prog.className = "on";
    prog.innerHTML = `<div class="prog-head">Reading “${escapeHtml(query)}”…</div>
                      <div class="prog-when"></div><div class="prog-rows"></div>`;
  }

  function plan(ev) {
    parallel = ev.parallel || 4;
    prog.querySelector(".prog-head").textContent = "Fetching";
    prog.querySelector(".prog-when").textContent =
      utc(ev.start) + " – " + utc(ev.end) + " UT" + (ev.note ? " · " + ev.note : "");
    const box = prog.querySelector(".prog-rows");
    box.innerHTML = "";
    rows = ev.sources.map((s, i) => {
      const el = document.createElement("div");
      el.className = "prog-row" + (i >= parallel ? " queued" : "");
      el.innerHTML = `<span class="mark spin">◜</span>
        <span class="what">${escapeHtml(s.display)}${
          s.options ? ` <span class="opts">· ${escapeHtml(s.options)}</span>` : ""}</span>
        <span class="t"></span>
        <span class="prog-bar${s.estimate_ms ? "" : " unknown"}"><i></i></span>`;
      box.appendChild(el);
      return {...s, el, started: i < parallel ? performance.now() : null, done: false};
    });
    tick();
    timer = setInterval(tick, 100);
  }

  function tick() {
    for (const row of rows) {
      if (row.done) continue;
      const t = row.el.querySelector(".t"), bar = row.el.querySelector(".prog-bar i");
      if (row.started === null) { t.textContent = "queued"; continue; }
      const ms = performance.now() - row.started;
      t.textContent = secs(ms) + (row.estimate_ms ? ` / ~${secs(row.estimate_ms)}` : "")
                    + (row.cached ? " · cached" : "");
      if (row.estimate_ms) {
        // never quite reaches the end while it is still running: a full bar
        // that keeps going is worse than an honest 95%
        bar.style.width = Math.min(95, (ms / row.estimate_ms) * 100).toFixed(0) + "%";
      }
    }
  }

  function finish(ev) {
    const row = rows.find(r => r.name === ev.source && !r.done);
    if (!row) return;
    row.done = true;
    row.el.classList.remove("queued");
    row.el.classList.add(ev.ok ? "done" : "failed");
    row.el.querySelector(".mark").className = "mark";
    row.el.querySelector(".mark").textContent = ev.ok ? "✓" : "✕";
    row.el.querySelector(".t").textContent =
      secs(ev.ms) + (ev.cached ? " · cached" : "");
    const bar = row.el.querySelector(".prog-bar");
    bar.classList.remove("unknown");
    bar.querySelector("i").style.width = "100%";
    if (!ev.ok && ev.error) {
      const e = document.createElement("span");
      e.className = "err"; e.textContent = ev.error;
      row.el.appendChild(e);
    }
    // a worker freed up: whichever row is still queued starts now
    const next = rows.find(r => r.started === null);
    if (next) { next.started = performance.now(); next.el.classList.remove("queued"); }
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    // a failed source keeps its row on screen: which one broke, and why, is
    // the whole diagnosis, and the plot below only shows what did work
    const failed = rows.some(r => r.el.classList.contains("failed"));
    prog.className = failed ? "on" : "";
    if (failed) prog.querySelector(".prog-head").textContent = "Fetched";
  }

  return {begin, plan, finish, stop};
})();

function utc(iso) { return iso.slice(0, 16).replace("T", " "); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

const plotDiv = document.getElementById("plot");

const DARK = {
  paper_bgcolor: "#0d1117", plot_bgcolor: "#161b22", font: {color:"#e6edf3"},
};

// spectral movies and the image grid loop on intervals; a new result must stop them
let movieTimers = [];
let timePlots = [];    // time-axis plots carrying the image timeline's cursor
let gridCursor = null; // the image grid's timeline, while one is on screen

function stopMovies() { movieTimers.forEach(clearInterval); movieTimers = []; }

function render(d) {
  stopMovies(); timePlots = []; gridCursor = null;
  plotDiv.innerHTML = "";
  plotDiv.style.height = "auto";
  const items = d.kind === "multi" ? d.items : [d];
  const stats = {points: 0, frames: 0, provenance: []};
  // flare peaks from any events item annotate every timeseries in the result
  const markers = items.flatMap(i => i.kind === "events" ? (i.markers || []) : []);
  // images go into one grid at the top; everything else stacks below it
  const images = items.filter(i => i.kind === "images");
  if (images.length) renderImageGrid(images, stats, items);
  items.filter(i => i.kind !== "images")
       .forEach(item => renderItem(item, items.length > 1, stats, markers));
  if (gridCursor) gridCursor.refresh();
  const notes = (d.kind === "multi" ? [d.note, ...items.map(i => i.note)] : [d.note]).filter(Boolean);
  // the wrapper note already carries the spelling corrections (server-side),
  // so d.note is the single source of truth for "what we read your query as"
  if (notes.length) { msg.textContent = [...new Set(notes)].join("\n"); msg.style.color = "#d29922"; }
  const bits = [];
  if (stats.points) bits.push(`${stats.points} points`);
  if (stats.frames) bits.push(`${stats.frames} frame(s)`);
  if (d.timings?.total) bits.push(timingLabel(d.timings, d.cached));
  meta.textContent = bits.join(" · ") + " · " + [...new Set(stats.provenance)].join(" · ");
  if (!stats.points && !stats.frames)
    msg.textContent = "Query understood, but no data in this interval (archive gap or future date?).";
}

// "2.4 s (flares 1.9, goes_xrs 0.4)" — the per-source breakdown is what makes a
// slow query diagnosable; hover shows every stage including parse and events
function timingLabel(t, cached) {
  const secs = ms => (ms / 1000).toFixed(ms < 100 ? 2 : 1);
  const hit = new Set(cached || []);
  const sources = Object.entries(t)
    .filter(([k]) => !["total", "parse", "resolve_event"].includes(k))
    .sort((a, b) => b[1] - a[1]);
  const top = sources.slice(0, 3)
    .map(([k, v]) => `${k} ${secs(v)}${hit.has(k) ? " cached" : ""}`).join(", ");
  const label = `${secs(t.total)} s${top ? ` (${top})` : ""}`;
  meta.title = Object.entries(t).map(([k, v]) =>
    `${k}: ${v} ms${hit.has(k) ? "  (from cache)" : ""}`).join("\n");
  return label;
}

function renderItem(item, compact, stats, markers) {
  if (item.provenance) stats.provenance.push(item.provenance);
  if (item.kind === "images") { renderImageGrid([item], stats, [item]); return; }
  if (item.kind === "events") { renderEvents(item, stats); return; }
  if (item.kind === "regions") { renderRegions(item, stats); return; }
  if (item.kind === "spectral_movie") { renderMovie(item, stats, markers); return; }
  const specs = item.kind === "panels" ? item.panels : [item];
  const plots = [];
  specs.forEach(s => {
    const el = document.createElement("div");
    el.style.height = s.kind === "positions" ? "560px"
                    : (compact || specs.length > 1) ? "300px" : "520px";
    plotDiv.appendChild(el);
    plots.push(el);
    if (s.kind === "spectrogram") { plotSpectrogram(el, s); stats.points += s.times.length * s.freqs.length; }
    else if (s.kind === "positions") { plotPositions(el, s); stats.points += s.bodies.length; }
    else if (s.kind === "earthmap") { plotEarthmap(el, s); stats.points += 1; }
    else { plotTimeseries(el, s, compact || specs.length > 1, markers); stats.points += s.series.reduce((a,x)=>a+x.values.length, 0); }
  });
  downloadBar(item, {plots});
}

// -- downloads ---------------------------------------------------------
// CSV/JSON go through the server so the file is generated from the same spec
// the figure was drawn from; PNG is rendered client-side by Plotly.

function downloadBar(item, {plots = [], frameUrl = null} = {}) {
  const bar = document.createElement("div");
  bar.className = "dl";
  const err = document.createElement("span");
  err.className = "dlerr";
  bar.appendChild(err);

  const add = (label, title, handler) => {
    const b = document.createElement("button");
    b.textContent = label; b.title = title;
    b.addEventListener("click", async () => {
      err.textContent = ""; b.disabled = true;
      const was = b.textContent; b.textContent = "…";
      try { await handler(); } catch (e) { err.textContent = String(e.message || e); }
      finally { b.disabled = false; b.textContent = was; }
    });
    bar.appendChild(b);
    return b;
  };

  if (plots.length) {
    add("PNG", "Save the figure as a PNG image", async () => {
      const base = (item.title || "figure").replace(/[^\w.-]+/g, "_").slice(0, 60);
      for (const [i, el] of plots.entries()) {
        await Plotly.downloadImage(el, {
          format: "png", scale: 2, width: el.clientWidth, height: el.clientHeight,
          filename: plots.length > 1 ? `${base}_panel${i + 1}` : base,
        });
      }
    });
  }
  if (frameUrl) {
    add("Open frame ↗", "Open this frame at full size in a new tab",
        async () => { window.open(frameUrl(), "_blank"); });
  }
  if (item.kind !== "images") {
    add("CSV", "Download the plotted values as CSV", () => serverDownload(item, "csv"));
  }
  add("Data (JSON)", "Download this result with its metadata as JSON",
      () => serverDownload(item, "json"));
  plotDiv.appendChild(bar);
}

async function serverDownload(spec, format) {
  const r = await fetch("/api/export", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({spec, format, query: currentQuery}),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error((d.errors || ["Export failed"])[0]);
  }
  const blob = await r.blob();
  const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name ? name[1] : `solarquick.${format}`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

function renderEvents(d, stats) {
  const box = document.createElement("div");
  box.className = "events";
  const evs = d.events || [];
  const rows = evs.map(ev => `
    <tr class="${ev.selected ? "sel" : ""}" data-q="${ev.query}">
      <td>${ev.class}</td>
      <td>${ev.peak.slice(0, 16).replace("T", " ")}</td>
      <td>${ev.start.slice(11, 16)}–${ev.end.slice(11, 16)}</td>
      <td>${ev.ar ? "AR " + ev.ar : ""}</td>
      <td title="${ev.position_from ? "Estimated: " + ev.position_from : ""}">${
        ev.x !== null ? `${ev.position_from ? "≈" : ""}(${ev.x}″, ${ev.y}″)` : ""}</td>
    </tr>`).join("");
  const sited = evs.filter(ev => ev.x !== null && ev.x !== undefined);
  box.innerHTML = `<h2>${d.title}</h2>` +
    (rows && !sited.length ? `<div class="evhint">No catalogued positions for these
      flares, so no flare-site map (recent SWPC entries often lack one).</div>` : "") + (rows
    ? `<div class="evbody">${sited.length ? `<div class="flaredisk"></div>` : ""}
       <div class="evtable"><table><thead><tr><th>Class</th><th>Peak (UT)</th>
       <th>Start–End</th><th>Region</th><th>Position</th></tr></thead>
       <tbody>${rows}</tbody></table></div></div>
       <div class="evhint">Click a flare (row or disk marker) to open its event view.</div>`
    : "");
  plotDiv.appendChild(box);
  const open = query => { q.value = query; f.requestSubmit(); };
  box.querySelectorAll("tr[data-q]").forEach(tr =>
    tr.addEventListener("click", () => open(tr.dataset.q)));
  if (sited.length) plotFlareDisk(box.querySelector(".flaredisk"), sited, open);
  stats.points += evs.length;
  if (evs.length) downloadBar(d);
}

// where the flares were: helioprojective arcsec over a mean 960″ radius
const FLARE_STYLE = {X: ["#e2604d", 18], M: ["#f0a832", 13], C: ["#4c9aff", 9]};
function plotFlareDisk(el, evs, open) {
  const R = 960;
  const style = ev => FLARE_STYLE[(ev.class || "?")[0]] || ["#8b949e", 6];
  Plotly.newPlot(el, [{
    x: evs.map(ev => ev.x / R), y: evs.map(ev => ev.y / R),
    mode: "markers+text", text: evs.map(ev => ev.class), textposition: "top center",
    textfont: {size: 9, color: "#c9d1d9"},
    marker: {size: evs.map(ev => style(ev)[1]), color: evs.map(ev => style(ev)[0]),
             symbol: evs.map(ev => ev.position_from ? "diamond" : "circle"),
             line: {color: evs.map(ev => ev.selected ? "#e6edf3" : "#0d1117"),
                    width: evs.map(ev => ev.selected ? 2 : 1)}, opacity: .9},
    customdata: evs.map(ev => ev.query),
    hovertext: evs.map(ev => `${ev.class} · peak ${ev.peak.slice(11, 16)} UT<br>` +
                             `${ev.position_from ? "≈" : ""}(${ev.x}″, ${ev.y}″)` +
                             (ev.ar ? " · AR " + ev.ar : "") +
                             (ev.position_from ? `<br>estimated from ${ev.position_from}` : "")),
    hoverinfo: "text", showlegend: false,
  }], {
    ...DARK,
    title: {text: "Flare sites", font: {size: 12}},
    xaxis: {range: [-1.2, 1.2], visible: false},
    yaxis: {range: [-1.2, 1.2], visible: false, scaleanchor: "x", scaleratio: 1},
    shapes: [{type: "circle", xref: "x", yref: "y", x0: -1, x1: 1, y0: -1, y1: 1,
              line: {color: "#30363d", width: 1}, fillcolor: "#161b22", layer: "below"}],
    annotations: [["N", 0, 1.1], ["S", 0, -1.1], ["E", -1.1, 0], ["W", 1.1, 0]].map(
      ([t, x, y]) => ({x, y, text: t, showarrow: false, font: {color: "#8b949e", size: 10}})),
    margin: {t: 30, b: 5, l: 5, r: 5},
  }, {responsive: true, displayModeBar: false});
  el.on("plotly_click", ev => open(ev.points[0].customdata));
}

// -- active regions ----------------------------------------------------
// One block draws three things, in the order the question is usually asked:
// the trend over the range (if the query spanned days), the disk as it stood
// on one snapshot, then the table of that snapshot's rows.

const COMPLEXITY = {
  "alpha":      {color: "#8b949e", label: "α  unipolar"},
  "beta":       {color: "#4c9aff", label: "β  bipolar"},
  "beta-gamma": {color: "#f0a832", label: "βγ  mixed polarities"},
  "delta":      {color: "#e2604d", label: "δ  flare-productive"},
};

function renderRegions(d, stats) {
  const plots = [];
  const box = document.createElement("div");
  box.className = "events regions";
  plotDiv.appendChild(box);
  box.innerHTML = `<h2>${escapeHtml(d.title)}</h2>`;

  (d.trend || []).forEach(t => {
    const el = document.createElement("div");
    el.style.height = "240px";
    box.appendChild(el); plots.push(el);
    plotTimeseries(el, t, true, null);
    stats.points += t.series.reduce((a, s) => a + s.values.length, 0);
  });

  const rows = d.regions || [];
  // a tracked region is one region over many days: every row belongs on the
  // map and in the table. Otherwise only the day the disk is drawn for does.
  const shown = d.track ? rows : rows.filter(r => r.valid === d.ref_valid);
  const mapped = shown.filter(r => r.x !== null && r.x !== undefined);
  if (mapped.length) {
    const el = document.createElement("div");
    el.style.height = "520px";
    box.appendChild(el); plots.push(el);
    plotRegionDisk(el, d, mapped);
  }

  const table = d.track ? rows : shown.filter(r => r.section === d.table_section);
  box.appendChild(regionTable(d, table));
  const extras = d.track ? [] : shown.filter(r => r.section !== d.table_section);
  regionExtras(extras).forEach(line => box.appendChild(line));

  stats.points += rows.length;
  downloadBar(d, {plots});
}

function plotRegionDisk(el, d, rows) {
  const traces = [];
  const size = r => r.area ? Math.min(34, 9 + 24 * Math.sqrt(r.area / 2500)) : 9;
  const hover = r =>
    `AR ${r.nmbr}<br>${r.location || ""}` +
    (r.carrington !== null ? `  ·  Carrington ${r.carrington}` : "") +
    (r.area !== null && r.area !== undefined ? `<br>${r.area} µhem` : "") +
    (r.mcintosh ? `  ·  ${r.mcintosh}` : "") +
    (r.spots !== null && r.spots !== undefined ? `  ·  ${r.spots} spots` : "") +
    (r.mag ? `<br>${r.mag}` : "") +
    (r.behind ? "<br>past the limb — shown at the edge" : "") +
    `<extra>${r.valid}</extra>`;

  if (d.track) {
    // the same region on successive days: its rotation across the disk
    traces.push({
      x: rows.map(r => r.x), y: rows.map(r => r.y),
      mode: "lines+markers+text", text: rows.map(r => r.valid.slice(5)),
      textposition: "top center", textfont: {size: 9, color: "#8b949e"},
      line: {color: "#f0a832", width: 1, dash: "dot"},
      marker: {size: rows.map(size), color: rows.map(r => COMPLEXITY[r.complexity].color),
               line: {color: "#0d1117", width: 1}},
      hovertemplate: "%{customdata}", customdata: rows.map(hover), showlegend: false,
    });
  } else {
    const plages = rows.filter(r => r.section === "plage");
    Object.entries(COMPLEXITY).forEach(([key, style]) => {
      const group = rows.filter(r => r.section === "spots" && r.complexity === key);
      if (!group.length) return;
      traces.push({
        x: group.map(r => r.x), y: group.map(r => r.y), name: style.label,
        mode: "markers+text", text: group.map(r => r.nmbr),
        textposition: "top center", textfont: {size: 10, color: "#e6edf3"},
        marker: {size: group.map(size), color: style.color,
                 symbol: group.map(r => r.behind ? "circle-open" : "circle"),
                 line: {color: "#0d1117", width: 1}},
        hovertemplate: "%{customdata}", customdata: group.map(hover),
      });
    });
    if (plages.length) traces.push({
      x: plages.map(r => r.x), y: plages.map(r => r.y), name: "plage (no spots)",
      mode: "markers", marker: {size: 7, color: "#30363d", symbol: "circle-open",
                                line: {color: "#8b949e", width: 1}},
      hovertemplate: "%{customdata}", customdata: plages.map(hover),
    });
  }

  const edge = {type: "circle", xref: "x", yref: "y", x0: -1, x1: 1, y0: -1, y1: 1,
                line: {color: "#30363d", width: 1}, fillcolor: "#161b22", layer: "below"};
  const compass = [["N", 0, 1.09], ["S", 0, -1.09], ["E", -1.09, 0], ["W", 1.09, 0]]
    .map(([t, x, y]) => ({x, y, text: t, showarrow: false,
                          font: {color: "#8b949e", size: 11}}));
  Plotly.newPlot(el, traces, {
    ...DARK,
    xaxis: {range: [-1.2, 1.2], visible: false},
    yaxis: {range: [-1.2, 1.2], visible: false, scaleanchor: "x", scaleratio: 1},
    shapes: [edge], annotations: compass,
    legend: {orientation: "h", y: -0.02, font: {size: 11}},
    margin: {t: 10, b: 40, l: 10, r: 10},
  }, {responsive: true});
}

function regionTable(d, rows) {
  const wrap = document.createElement("div");
  if (!rows.length) {
    wrap.className = "evhint";
    wrap.textContent = "No regions in this section of the summary.";
    return wrap;
  }
  const first = d.track ? "Date" : "Region";
  const cells = r => [
    d.track ? r.valid : `AR ${r.nmbr}`,
    r.location || (r.lat !== null ? `${r.lat > 0 ? "N" : "S"}${Math.abs(r.lat)}` : ""),
    r.carrington === null ? "" : r.carrington,
    r.area === null || r.area === undefined ? "" : r.area,
    r.mcintosh || "", r.spots === null || r.spots === undefined ? "" : r.spots,
    r.mag || "",
  ];
  const body = rows.map(r => `<tr data-q="${escapeHtml(r.query)}">` +
    cells(r).map(c => `<td>${escapeHtml(c)}</td>`).join("") + "</tr>").join("");
  wrap.innerHTML = `<table><thead><tr><th>${first}</th><th>Location</th>
    <th>Carr. lon</th><th>Area (µhem)</th><th>McIntosh</th><th>Spots</th>
    <th>Mag type</th></tr></thead><tbody>${body}</tbody></table>
    <div class="evhint">Click a row for that region's week on the disk.</div>`;
  wrap.querySelectorAll("tr[data-q]").forEach(tr => tr.addEventListener("click", () => {
    q.value = tr.dataset.q; f.requestSubmit();
  }));
  return wrap;
}

// The sections the table isn't showing still belong in the answer — the SRS
// is one document, and a summary that silently dropped the plages would not
// be the summary.
function regionExtras(rows) {
  const labels = {"spots": "With sunspots", "plage": "Plages without spots",
                  "return": "Due to return"};
  return ["spots", "plage", "return"].filter(s => rows.some(r => r.section === s))
    .map(section => {
      const line = document.createElement("div");
      line.className = "rsum";
      const names = rows.filter(r => r.section === section)
        .map(r => `${r.nmbr}${r.location ? " " + r.location : ""}`).join(" · ");
      line.innerHTML = `<b>${labels[section]}:</b> ${escapeHtml(names)}`;
      return line;
    });
}

function plotTimeseries(el, d, compact, markers) {
  const traces = d.series.map(s => ({
    x: s.times || s.x, y: s.values, name: s.name, mode: "lines", line: {width: 1.5}
  }));
  const shapes = [], annotations = [];
  (d.bands || []).forEach((b, i) => {
    if (i % 2) shapes.push({type:"rect", xref:"paper", x0:0, x1:1, yref:"y",
      y0:b.y0, y1:b.y1, fillcolor:"rgba(255,255,255,0.04)", line:{width:0}});
    annotations.push({xref:"paper", x:1.005, xanchor:"left", yref:"y",
      y: Math.log10(Math.sqrt(b.y0*b.y1)), text:b.label, showarrow:false,
      font:{color:"#8b949e", size:11}});
  });
  const isTimeAxis = d.series.some(s => s.times);
  if (isTimeAxis) (markers || []).forEach(mk => {
    shapes.push({type:"line", x0:mk.t, x1:mk.t, xref:"x", yref:"paper", y0:0, y1:1,
      line:{color:"#e2604d", width:1, dash:"dot"}});
    annotations.push({x:mk.t, xref:"x", yref:"paper", y:1.02, text:mk.label,
      showarrow:false, font:{color:"#e2604d", size:10}});
  });
  // the image grid's timeline cursor, on every time axis below it
  let cursorIdx = -1;
  if (isTimeAxis && gridCursor) {
    cursorIdx = shapes.length;
    shapes.push({type:"line", xref:"x", yref:"paper", x0: gridCursor.time(),
      x1: gridCursor.time(), y0:0, y1:1, line:{color:"#f0a832", width:1.5}});
  }
  Plotly.newPlot(el, traces, {
    ...DARK,
    title: {text: d.title, font:{size: compact ? 12 : 14}},
    xaxis: {title: d.xaxis?.label, gridcolor:"#30363d"},
    yaxis: {title: d.yaxis?.label, type: d.yaxis?.type || "linear",
            gridcolor:"#30363d", exponentformat:"power",
            range: d.yaxis?.range ? d.yaxis.range.map(Math.log10) : undefined},
    shapes, annotations,
    legend: {orientation:"h", y: compact ? -0.3 : -0.2},
    margin: {t: compact ? 35 : 50, r:40, b: compact ? 30 : undefined}
  }, {responsive: true});
  if (cursorIdx >= 0) {
    timePlots.push({el, idx: cursorIdx});
    el.on("plotly_click", ev => gridCursor && gridCursor.jumpTo(ev.points[0].x));
  }
}

function plotSpectrogram(el, d) {
  Plotly.newPlot(el, [{
    type: "heatmap", x: d.times, y: d.freqs, z: d.z,
    colorscale: "Viridis", zmin: d.zrange?.[0], zmax: d.zrange?.[1],
    colorbar: {title: {text: d.zlabel || "", side: "right"}, thickness: 12}
  }], {
    ...DARK,
    title: {text: d.title, font:{size:12}},
    xaxis: {title: d.xaxis?.label, gridcolor:"#30363d"},
    yaxis: {title: d.yaxis?.label, type: d.yaxis?.type || "linear", gridcolor:"#30363d"},
    margin: {t:35, r:20, b:30}
  }, {responsive: true});
}

function plotPositions(el, d) {
  const traces = [{
    x: [0], y: [0], mode: "markers+text", text: ["Sun"], textposition: "bottom center",
    textfont: {size: 11, color: "#8b949e"}, hoverinfo: "skip",
    marker: {symbol: "star", size: 16, color: "#f0a832"},
  }];
  d.bodies.forEach(b => {
    if (b.trail)
      traces.push({x: b.trail.x, y: b.trail.y, mode: "lines",
        line: {width: 1.2, color: b.color}, opacity: 0.45, hoverinfo: "skip"});
    traces.push({
      x: [b.x], y: [b.y], mode: "markers+text", text: [b.name],
      textposition: "top center", textfont: {size: 11, color: "#e6edf3"},
      marker: {size: b.type === "planet" ? 10 : 8, color: b.color,
               symbol: b.type === "planet" ? "circle" : "diamond"},
      hovertemplate: `${b.name}<br>r = ${b.r.toFixed(3)} AU` +
                     `<br>lon = ${b.lon_deg.toFixed(1)}°<extra></extra>`,
    });
  });
  const shapes = d.bodies.filter(b => b.type === "planet").map(b => ({
    type: "circle", xref: "x", yref: "y", x0: -b.r, x1: b.r, y0: -b.r, y1: b.r,
    line: {color: "#30363d", width: 1, dash: "dot"},
  }));
  const R = Math.max(...d.bodies.map(b => b.r)) * 1.3;
  Plotly.newPlot(el, traces, {
    ...DARK,
    title: {text: d.title, font: {size: 13}},
    xaxis: {range: [-R, R], gridcolor: "#21262d", zeroline: false, title: "AU"},
    yaxis: {range: [-R, R], gridcolor: "#21262d", zeroline: false,
            scaleanchor: "x", scaleratio: 1},
    shapes, showlegend: false, margin: {t: 40, r: 20},
  }, {responsive: true});
}

function plotEarthmap(el, d) {
  const traces = [];
  (d.shading || []).forEach(b => traces.push({
    type: "scattergeo", mode: "lines", lon: b.lon, lat: b.lat,
    line: {color: "#000000", width: 7}, opacity: b.opacity,
    hoverinfo: "skip", name: b.label, showlegend: false,
  }));
  (d.lines || []).forEach(l => traces.push({
    type: "scattergeo", mode: "lines", lon: l.lon, lat: l.lat,
    line: {color: "#f0a832", width: 1.5}, name: l.name,
    hoverinfo: "skip", showlegend: false,
  }));
  if (d.track) traces.push({
    type: "scattergeo", mode: "lines+markers", lon: d.track.lon, lat: d.track.lat,
    line: {color: "#e2604d", width: 1.5, dash: "dot"}, marker: {size: 3},
    name: d.track.name, hoverinfo: "skip", showlegend: false,
  });
  (d.points || []).forEach(p => traces.push({
    type: "scattergeo", mode: "markers", lon: [p.lon], lat: [p.lat],
    marker: {symbol: "star", size: 14, color: "#f0a832"},
    hovertemplate: `${p.name}<br>${p.lat.toFixed(1)}°, ${p.lon.toFixed(1)}°<extra></extra>`,
    showlegend: false,
  }));
  Plotly.newPlot(el, traces, {
    ...DARK,
    title: {text: d.title, font: {size: 13}},
    geo: {
      projection: {type: "natural earth"}, bgcolor: "#0d1117",
      showcoastlines: true, coastlinecolor: "#8b949e", coastlinewidth: 0.7,
      showland: true, landcolor: "#2d333b",
      showocean: true, oceancolor: "#161b22",
      showcountries: false, showframe: false,
      lataxis: {showgrid: true, gridcolor: "#21262d", dtick: 30},
      lonaxis: {showgrid: true, gridcolor: "#21262d", dtick: 60},
    },
    margin: {t: 40, b: 10, l: 10, r: 10},
  }, {responsive: true});
}

// Spectral movie: one spectrum per frame on fixed axes (so frames compare),
// the start spectrum as a grey reference, and a band light curve below with a
// cursor at the current frame. Loops until paused; click the curve to jump.
function renderMovie(d, stats, markers) {
  const box = document.createElement("div");
  box.className = "movie";
  box.innerHTML = `<div class="mspec"></div>
    <div class="mctl"><button class="mplay" title="Play / pause">❚❚</button>
      <input class="mslider" type="range" min="0" step="1">
      <span class="mtime"></span>
      <select class="mfps" title="Playback speed">
        <option value="2">2 fps</option><option value="5" selected>5 fps</option>
        <option value="10">10 fps</option><option value="20">20 fps</option></select></div>
    <div class="mlc"></div>`;
  plotDiv.appendChild(box);
  const spec = box.querySelector(".mspec"), lc = box.querySelector(".mlc"),
        play = box.querySelector(".mplay"), slider = box.querySelector(".mslider"),
        label = box.querySelector(".mtime"), fps = box.querySelector(".mfps");
  const n = d.frames.length, grid = "#30363d";
  slider.max = n - 1;
  const ylog = d.yaxis?.type === "log";
  Plotly.newPlot(spec, [
    {x: d.wavelengths, y: d.frames[0], name: `start ${utc(d.times[0]).slice(11)} UT`,
     mode: "lines", line: {width: 1, color: "#6e7681"}, hoverinfo: "skip"},
    {x: d.wavelengths, y: d.frames[0], name: "spectrum", mode: "lines",
     line: {width: 1.3, color: "#f0a832"}},
  ], {
    ...DARK,
    title: {text: d.title, font: {size: 14}},
    xaxis: {title: d.xaxis?.label, gridcolor: grid,
            range: [d.wavelengths[0], d.wavelengths[d.wavelengths.length - 1]]},
    yaxis: {title: d.yaxis?.label, type: d.yaxis?.type || "linear", gridcolor: grid,
            exponentformat: "power",
            range: d.yaxis?.range ? (ylog ? d.yaxis.range.map(Math.log10) : d.yaxis.range) : undefined},
    legend: {orientation: "h", y: -0.18}, margin: {t: 50, r: 40},
  }, {responsive: true});

  const L = d.lightcurve;
  const shapes = [{type: "line", xref: "x", yref: "paper", x0: d.times[0], x1: d.times[0],
                   y0: 0, y1: 1, line: {color: "#f0a832", width: 1.5}}];
  const annotations = [];
  (markers || []).forEach(mk => {
    shapes.push({type: "line", x0: mk.t, x1: mk.t, xref: "x", yref: "paper", y0: 0, y1: 1,
      line: {color: "#e2604d", width: 1, dash: "dot"}});
    annotations.push({x: mk.t, xref: "x", yref: "paper", y: 1.04, text: mk.label,
      showarrow: false, font: {color: "#e2604d", size: 10}});
  });
  Plotly.newPlot(lc, [{x: L.times, y: L.values, name: L.name, mode: "lines",
                       line: {width: 1.5, color: "#58a6ff"}}], {
    ...DARK,
    title: {text: L.name, font: {size: 12}},
    xaxis: {gridcolor: grid},
    yaxis: {title: L.yaxis?.label, type: L.yaxis?.type || "linear", gridcolor: grid,
            exponentformat: "power"},
    shapes, annotations, showlegend: false, margin: {t: 35, r: 40, b: 30},
  }, {responsive: true});

  // wall-clock ms with any offset dropped, as Plotly reports clicked dates
  const wall = t => Date.parse(String(t).replace(" ", "T").slice(0, 19) + "Z");
  const frameMs = d.times.map(wall);
  let i = 0, timer = null;
  const show = k => {
    i = k;
    Plotly.restyle(spec, {y: [d.frames[k]]}, [1]);
    Plotly.relayout(lc, {"shapes[0].x0": d.times[k], "shapes[0].x1": d.times[k]});
    slider.value = k;
    label.textContent = `${utc(d.times[k])} UT · ${k + 1}/${n}`;
  };
  const stop = () => { if (timer) clearInterval(timer); timer = null; play.textContent = "▶"; };
  const start = () => {
    stop();
    timer = setInterval(() => show((i + 1) % n), 1000 / +fps.value);
    movieTimers.push(timer);
    play.textContent = "❚❚";
  };
  play.addEventListener("click", () => timer ? stop() : start());
  slider.addEventListener("input", () => { stop(); show(+slider.value); });
  fps.addEventListener("change", () => { if (timer) start(); });
  lc.on("plotly_click", ev => {
    const t = wall(ev.points[0].x);
    let best = 0;
    frameMs.forEach((m, k) => { if (Math.abs(m - t) < Math.abs(frameMs[best] - t)) best = k; });
    stop(); show(best);
  });
  show(0);
  if (n > 1) start(); else stop();
  stats.frames += n;
  stats.points += n * d.wavelengths.length;
  downloadBar(d, {plots: [spec, lc]});
}

// -- the image grid ----------------------------------------------------------
// Every image block in the result shares one timeline (the frame slots the
// server sampled, `t_req`), so the panels step together: arrows in stills
// mode, a loop in movie mode, and a cursor on every time axis below. Stills
// load only the frame on show; a movie preloads and waits for each frame to
// arrive rather than flashing half-loaded panels. "Flare peak" fetches the
// frame at the peak for every panel after the fact and jumps there.
function renderImageGrid(items, stats, allItems) {
  const movie = !!(lastRun && lastRun.movie);
  const slot = fr => fr.t_req || fr.time;
  const ms = t => Date.parse(String(t).replace(" ", "T").slice(0, 19) + "Z");
  const byTime = (a, b) => ms(a) - ms(b);
  const panels = items.map(it => ({item: it, frames: [...(it.images || [])]}));
  let timeline = [...new Set(panels.flatMap(p => p.frames.map(slot)))].sort(byTime);
  const n = panels.length, cols = n === 4 ? 2 : Math.min(n, 3);

  const wrap = document.createElement("div");
  wrap.className = "imgwrap";
  wrap.innerHTML = `<div class="imggrid"></div>
    <div class="transport">
      <button class="prev" title="Previous frame">‹</button>
      <button class="play" title="Play / pause">▶</button>
      <button class="next" title="Next frame">›</button>
      <input class="tslider" type="range" min="0" step="1" value="0">
      <span class="ttime"></span>
      <label class="chk"><input type="checkbox" class="peak"> Flare peak</label>
      <select class="tfps" title="Playback speed"><option value="2">2 fps</option>
        <option value="4" selected>4 fps</option><option value="8">8 fps</option></select>
    </div>`;
  plotDiv.appendChild(wrap);
  const $w = s => wrap.querySelector(s);
  const gridEl = $w(".imggrid"), slider = $w(".tslider"), label = $w(".ttime"),
        playBtn = $w(".play"), fps = $w(".tfps"), peakBox = $w(".peak");
  if (!movie) { playBtn.style.display = "none"; fps.style.display = "none"; }
  // a 2×2 at full width would push the light curves off screen
  if (n === 4) { gridEl.style.maxWidth = "820px"; gridEl.style.margin = "0 auto"; }

  const cells = panels.map(p => {
    const c = document.createElement("div");
    c.className = "cell";
    c.style.width = `calc((100% - ${cols - 1} * .6rem) / ${cols})`;
    c.innerHTML = `<div class="ctitle"></div><div class="cimg"><img alt=""></div>
                   <div class="ccap"></div>`;
    c.querySelector(".ctitle").textContent = p.item.label || p.item.title;
    c.querySelector(".ctitle").title = p.item.title;
    gridEl.appendChild(c);
    if (p.item.provenance) stats.provenance.push(p.item.provenance);
    stats.frames += p.frames.length;
    return c;
  });

  const nearest = (p, t) => {
    let best = null, gap = Infinity;
    for (const fr of p.frames) {
      if (slot(fr) === t) return fr;
      const g = Math.abs(ms(slot(fr)) - ms(t));
      if (g < gap) { gap = g; best = fr; }
    }
    return best;
  };
  const srcOf = fr => fr.grid_url || fr.url;
  const cache = new Map();   // movie mode: url → preloaded Image
  const preload = fr => {
    const u = srcOf(fr);
    if (!cache.has(u)) { const im = new Image(); im.src = u; cache.set(u, im); }
  };
  if (movie) panels.forEach(p => p.frames.forEach(preload));
  const ready = i => panels.every(p => {
    const fr = nearest(p, timeline[i]);
    return !fr || (cache.get(srcOf(fr))?.complete ?? true);
  });

  let k = 0, timer = null;
  const show = i => {
    if (!timeline.length) { label.textContent = "No images in this interval"; return; }
    k = ((i % timeline.length) + timeline.length) % timeline.length;
    const t = timeline[k];
    panels.forEach((p, j) => {
      const fr = nearest(p, t), img = cells[j].querySelector("img"),
            cap = cells[j].querySelector(".ccap");
      if (!fr) { cap.textContent = "No images in this interval"; return; }
      if (img.getAttribute("src") !== srcOf(fr)) img.src = srcOf(fr);
      img.onclick = () => window.open(fr.url, "_blank");
      img.title = "Open full resolution";
      cap.textContent = fr.caption;
    });
    slider.max = Math.max(0, timeline.length - 1);
    slider.value = k;
    label.textContent = `${utc(t)} UT · ${k + 1}/${timeline.length}`;
    timePlots.forEach(({el, idx}) => Plotly.relayout(el, {
      [`shapes[${idx}].x0`]: t, [`shapes[${idx}].x1`]: t}));
  };
  const stop = () => { if (timer) clearInterval(timer); timer = null; playBtn.textContent = "▶"; };
  const start = () => {
    stop();
    timer = setInterval(() => {
      const next = (k + 1) % timeline.length;
      if (ready(next)) show(next);
      else label.textContent = `${utc(timeline[k])} UT · loading frames…`;
    }, 1000 / +fps.value);
    movieTimers.push(timer);
    playBtn.textContent = "❚❚";
  };
  $w(".prev").addEventListener("click", () => { stop(); show(k - 1); });
  $w(".next").addEventListener("click", () => { stop(); show(k + 1); });
  playBtn.addEventListener("click", () => timer ? stop() : start());
  fps.addEventListener("change", () => { if (timer) start(); });
  slider.addEventListener("input", () => { stop(); show(+slider.value); });

  peakBox.addEventListener("change", async () => {
    if (!peakBox.checked) return;
    stop();
    label.textContent = "Finding the flare peak…";
    try {
      const chosen = allItems.flatMap(i => i.kind === "events"
        ? (i.events || []).filter(e => e.selected) : [])[0];
      let peak = chosen && chosen.peak, name = chosen && chosen.class;
      if (!peak) {
        const qs = new URLSearchParams({start: lastRun.start, end: lastRun.end});
        const fl = (await (await fetch("/api/flare?" + qs)).json()).flare;
        if (!fl) { label.textContent = "No catalogued flare in this window";
                   peakBox.checked = false; return; }
        peak = fl.peak; name = fl.class;
      }
      label.textContent = `Loading the ${name} peak frames…`;
      await Promise.all(panels.map(async p => {
        if (!p.item.request) return;
        const r = await fetch("/api/frame", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({...p.item.request, time: peak}),
        });
        if (!r.ok) return;  // e.g. Hinode: no single-frame lookup, nearest frame stands
        const fr = await r.json();
        fr.t_req = peak; fr.caption += `  ·  ${name} peak`;
        if (movie) preload(fr);
        p.frames = p.frames.filter(x => slot(x) !== peak).concat(fr)
                           .sort((a, b) => byTime(slot(a), slot(b)));
      }));
      if (!timeline.includes(peak)) timeline = [...timeline, peak].sort(byTime);
      show(timeline.indexOf(peak));
    } catch (e) {
      label.textContent = "Could not load the flare peak: " + e;
      peakBox.checked = false;
    }
  });

  gridCursor = {
    time: () => timeline[k] || null,
    refresh: () => show(k),
    jumpTo: x => {
      const t = ms(x);
      let best = 0;
      timeline.forEach((s, i) => {
        if (Math.abs(ms(s) - t) < Math.abs(ms(timeline[best]) - t)) best = i; });
      stop(); show(best);
    },
  };
  show(0);
  if (movie && timeline.length > 1) start();
}
init();
</script>
</body>
</html>
