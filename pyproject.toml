[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarquick"
version = "1.1.0b2"
description = "Quicklook browser for solar physics data — type a plain-English request, get a plot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harry Greatorex" }]
keywords = ["solar physics", "heliophysics", "quicklook", "sunpy", "GOES", "SDO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    # `visualization` looks unnecessary — nothing here calls sunpy's plotting —
    # but sunpy 8's timeseries package imports sunpy.visualization at module
    # level, so without mpl-animators every sunpy-backed source (GOES archival
    # XRS, RHESSI, LYRA, EVE, GBM, SOT) dies with "No module named
    # 'mpl_animators'" at fetch time.
    "sunpy[net,timeseries,visualization]>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "numpy>=1.24",
    "cdflib>=1.0",      # Wind/WAVES L2 CDFs
    "h5netcdf>=1.0",    # GOES EUVS netCDF
    "matplotlib>=3.7",  # Hinode SOT FITS rendering
    "astroquery>=0.4.7", # JPL Horizons spacecraft ephemerides (positions)
]

[project.optional-dependencies]
# httpx is required by starlette's TestClient, which the export API tests use
dev = ["pytest", "httpx"]
# free-form query understanding; dormant unless ANTHROPIC_API_KEY is set
llm = ["anthropic>=0.60"]

[project.urls]
Homepage = "https://github.com/HGreatorex/solarquick"
Issues = "https://github.com/HGreatorex/solarquick/issues"

[project.scripts]
solarquick = "solarapp.__main__:main"
solarapp = "solarapp.__main__:main"  # kept so existing installs keep working

[tool.setuptools.packages.find]
include = ["solarapp*"]

[tool.setuptools.package-data]
"solarapp.server" = ["static/*"]
