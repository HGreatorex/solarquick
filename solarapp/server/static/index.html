<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolarQuick</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0d1117; color:#e6edf3;
         max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-weight: 600; font-size: 1.4rem; } h1 span { color:#f0a832; }
  form { display:flex; gap:.5rem; margin:1rem 0; }
  input { flex:1; padding:.7rem 1rem; font-size:1rem; border-radius:8px;
          border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  button { padding:.7rem 1.2rem; font-size:1rem; border-radius:8px; border:none;
           background:#f0a832; color:#0d1117; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #msg { color:#ff7b72; margin:.5rem 0; white-space:pre-wrap; }
  #meta { color:#8b949e; font-size:.85rem; margin-top:.5rem; }
  #plot { width:100%; height:520px; }
  .hint { color:#8b949e; font-size:.85rem; }
  .imgview h2 { font-size:1rem; font-weight:600; text-align:center; margin:.5rem 0; }
  .imgview .mainimg { display:block; max-width:640px; width:100%; margin:0 auto;
                      border-radius:8px; background:#161b22; cursor:zoom-in; }
  .imgview .imgcap { text-align:center; color:#8b949e; font-size:.85rem; margin:.5rem 0; }
  .imgview .thumbs { display:flex; gap:.4rem; justify-content:center; flex-wrap:wrap; margin:.5rem 0; }
  .imgview .thumbs img { width:72px; height:72px; border-radius:6px; cursor:pointer;
                         border:2px solid transparent; background:#161b22; }
  .imgview .thumbs img.sel { border-color:#f0a832; }
  .imgview .note { color:#d29922; font-size:.85rem; text-align:center; margin:.5rem 0; }
</style>
</head>
<body>
<h1>Solar<span>Quick</span></h1>
<p class="hint">e.g. “goes sxr yesterday” · “sdo aia 304 and goes xrs yesterday” · “lasco c3 2026-08-01” · “stix and wind waves 2026-07-11” · “eve he ii 304 yesterday” · “euvs yesterday” · “rhessi 2003-10-28” · “positions today” · “where is psp from 2026-06-01 to 2026-08-01”</p>
<form id="f">
  <input id="q" placeholder="Ask for data…" autofocus autocomplete="off">
  <button id="go">Plot</button>
</form>
<div id="msg"></div>
<div id="plot"></div>
<div id="meta"></div>
<script>
const f = document.getElementById("f"), q = document.getElementById("q"),
      go = document.getElementById("go"), msg = document.getElementById("msg"),
      meta = document.getElementById("meta");

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = ""; meta.textContent = ""; go.disabled = true; go.textContent = "Fetching…";
  msg.style.color = "";
  try {
    const r = await fetch("/api/query", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({q: q.value})
    });
    const d = await r.json();
    if (!r.ok) { msg.textContent = (d.errors || ["Request failed"]).join("\n"); return; }
    render(d);
  } catch (err) { msg.textContent = "Error: " + err; }
  finally { go.disabled = false; go.textContent = "Plot"; }
});

const plotDiv = document.getElementById("plot");

const DARK = {
  paper_bgcolor: "#0d1117", plot_bgcolor: "#161b22", font: {color:"#e6edf3"},
};

function render(d) {
  plotDiv.innerHTML = "";
  plotDiv.style.height = "auto";
  const items = d.kind === "multi" ? d.items : [d];
  const stats = {points: 0, frames: 0, provenance: []};
  items.forEach(item => renderItem(item, items.length > 1, stats));
  const notes = [d.note, ...items.map(i => i.note)].filter(Boolean);
  if (notes.length) { msg.textContent = notes.join("\n"); msg.style.color = "#d29922"; }
  const bits = [];
  if (stats.points) bits.push(`${stats.points} points`);
  if (stats.frames) bits.push(`${stats.frames} frame(s)`);
  meta.textContent = bits.join(" · ") + " · " + [...new Set(stats.provenance)].join(" · ");
  if (!stats.points && !stats.frames)
    msg.textContent = "Query understood, but no data in this interval (archive gap or future date?).";
}

function renderItem(item, compact, stats) {
  if (item.provenance) stats.provenance.push(item.provenance);
  if (item.kind === "images") { renderImages(item, stats); return; }
  const specs = item.kind === "panels" ? item.panels : [item];
  specs.forEach(s => {
    const el = document.createElement("div");
    el.style.height = s.kind === "positions" ? "560px"
                    : (compact || specs.length > 1) ? "300px" : "520px";
    plotDiv.appendChild(el);
    if (s.kind === "spectrogram") { plotSpectrogram(el, s); stats.points += s.times.length * s.freqs.length; }
    else if (s.kind === "positions") { plotPositions(el, s); stats.points += s.bodies.length; }
    else { plotTimeseries(el, s, compact || specs.length > 1); stats.points += s.series.reduce((a,x)=>a+x.values.length, 0); }
  });
}

function plotTimeseries(el, d, compact) {
  const traces = d.series.map(s => ({
    x: s.times || s.x, y: s.values, name: s.name, mode: "lines", line: {width: 1.5}
  }));
  const shapes = [], annotations = [];
  (d.bands || []).forEach((b, i) => {
    if (i % 2) shapes.push({type:"rect", xref:"paper", x0:0, x1:1, yref:"y",
      y0:b.y0, y1:b.y1, fillcolor:"rgba(255,255,255,0.04)", line:{width:0}});
    annotations.push({xref:"paper", x:1.005, xanchor:"left", yref:"y",
      y: Math.log10(Math.sqrt(b.y0*b.y1)), text:b.label, showarrow:false,
      font:{color:"#8b949e", size:11}});
  });
  Plotly.newPlot(el, traces, {
    ...DARK,
    title: {text: d.title, font:{size: compact ? 12 : 14}},
    xaxis: {title: d.xaxis?.label, gridcolor:"#30363d"},
    yaxis: {title: d.yaxis?.label, type: d.yaxis?.type || "linear",
            gridcolor:"#30363d", exponentformat:"power",
            range: d.yaxis?.range ? d.yaxis.range.map(Math.log10) : undefined},
    shapes, annotations,
    legend: {orientation:"h", y: compact ? -0.3 : -0.2},
    margin: {t: compact ? 35 : 50, r:40, b: compact ? 30 : undefined}
  }, {responsive: true});
}

function plotSpectrogram(el, d) {
  Plotly.newPlot(el, [{
    type: "heatmap", x: d.times, y: d.freqs, z: d.z,
    colorscale: "Viridis", zmin: d.zrange?.[0], zmax: d.zrange?.[1],
    colorbar: {title: {text: d.zlabel || "", side: "right"}, thickness: 12}
  }], {
    ...DARK,
    title: {text: d.title, font:{size:12}},
    xaxis: {title: d.xaxis?.label, gridcolor:"#30363d"},
    yaxis: {title: d.yaxis?.label, type: d.yaxis?.type || "linear", gridcolor:"#30363d"},
    margin: {t:35, r:20, b:30}
  }, {responsive: true});
}

function plotPositions(el, d) {
  const traces = [{
    x: [0], y: [0], mode: "markers+text", text: ["Sun"], textposition: "bottom center",
    textfont: {size: 11, color: "#8b949e"}, hoverinfo: "skip",
    marker: {symbol: "star", size: 16, color: "#f0a832"},
  }];
  d.bodies.forEach(b => {
    if (b.trail)
      traces.push({x: b.trail.x, y: b.trail.y, mode: "lines",
        line: {width: 1.2, color: b.color}, opacity: 0.45, hoverinfo: "skip"});
    traces.push({
      x: [b.x], y: [b.y], mode: "markers+text", text: [b.name],
      textposition: "top center", textfont: {size: 11, color: "#e6edf3"},
      marker: {size: b.type === "planet" ? 10 : 8, color: b.color,
               symbol: b.type === "planet" ? "circle" : "diamond"},
      hovertemplate: `${b.name}<br>r = ${b.r.toFixed(3)} AU` +
                     `<br>lon = ${b.lon_deg.toFixed(1)}°<extra></extra>`,
    });
  });
  const shapes = d.bodies.filter(b => b.type === "planet").map(b => ({
    type: "circle", xref: "x", yref: "y", x0: -b.r, x1: b.r, y0: -b.r, y1: b.r,
    line: {color: "#30363d", width: 1, dash: "dot"},
  }));
  const R = Math.max(...d.bodies.map(b => b.r)) * 1.3;
  Plotly.newPlot(el, traces, {
    ...DARK,
    title: {text: d.title, font: {size: 13}},
    xaxis: {range: [-R, R], gridcolor: "#21262d", zeroline: false, title: "AU"},
    yaxis: {range: [-R, R], gridcolor: "#21262d", zeroline: false,
            scaleanchor: "x", scaleratio: 1},
    shapes, showlegend: false, margin: {t: 40, r: 20},
  }, {responsive: true});
}

function renderImages(d, stats) {
  const box = document.createElement("div");
  box.className = "imgview";
  box.innerHTML = `<h2></h2><img class="mainimg" alt="solar image">
    <div class="imgcap"></div><div class="thumbs"></div>`;
  plotDiv.appendChild(box);
  box.querySelector("h2").textContent = d.title;
  const main = box.querySelector(".mainimg"), cap = box.querySelector(".imgcap"),
        thumbs = box.querySelector(".thumbs");
  if (!d.images.length) { cap.textContent = "No images found for this interval."; return; }
  const show = (i) => {
    main.src = d.images[i].url; cap.textContent = d.images[i].caption;
    main.onclick = () => window.open(d.images[i].url, "_blank");
    [...thumbs.children].forEach((t, j) => t.classList.toggle("sel", j === i));
  };
  d.images.forEach((im, i) => {
    const t = document.createElement("img");
    t.src = im.url; t.title = im.caption; t.loading = "lazy";
    t.addEventListener("click", () => show(i));
    thumbs.appendChild(t);
  });
  show(0);
  stats.frames += d.images.length;
}
</script>
</body>
</html>
